[package]
name = "clatterkey"
version = "0.1.0"
description = "Plays mechanical keyboard sounds on every key press"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
name = "clatterkey_lib"

# Dev command that prints key events: `npm run keys`. Not part of the app.
[[example]]
name = "keys"
path = "examples/keys/main.rs"
test = true

# Generates the bundled sound packs: `npm run make-packs`. Not part of the app.
[[example]]
name = "make-packs"
path = "examples/make_packs/main.rs"
test = true

# Generates the app icon: `npm run make-app-icons`. Not part of the app.
[[example]]
name = "make-app-icons"
path = "examples/make_app_icons/main.rs"
test = true

# Generates the tray icons: `npm run make-tray-icons`. Not part of the app.
[[example]]
name = "make-tray-icons"
path = "examples/make_tray_icons/main.rs"
test = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` for the tray; `image-png` to read its icons.
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
# A second launch shows the running app's window instead of starting again.
tauri-plugin-single-instance = "2.5"
# The system folder picker for importing a pack. Only its Rust API is used.
tauri-plugin-dialog = "2.8"
# Registers the app with the system to start at login. Only its Rust API
# is used.
tauri-plugin-autostart = "2.7"
# The library the autostart plugin is built on, at the plugin's version.
# Used directly only to reach the login registrations the app left under
# its earlier names (`handover`), which the plugin cannot name.
auto-launch = "0.6"
# Audio output and mixer, and decoders for the formats a sound pack may use.
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "vorbis", "mp3", "flac"] }
# Reads `pack.json`.
serde_json = "1.0"

# Key capture. Each back end is declared only for its own OS, so other
# targets (the Linux check) compile with no key-capture code at all.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDate", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }

[target.'cfg(target_os = "windows")'.dependencies]
rdev = { git = "https://github.com/Narsil/rdev", rev = "b7e201bf80be7b9632207366f277d29fe732b9c1" }
# Removes an earlier name's `StartupApproved` value, which `auto-launch`
# leaves behind. The version `auto-launch` itself uses.
windows-registry = "0.6"

[dev-dependencies]
# Compressed PNG output for the app icon generator
# (`examples/make_app_icons`), and reading it back in its tests. Not
# compiled into the app.
png = "0.18"
